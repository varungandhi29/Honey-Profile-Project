version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: honey_redis
    ports:
      - "6379:6379"
    restart: always

  mongodb:
    image: mongo:latest
    container_name: honey_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  ai-engine:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: honey_ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honey_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/honeyshield?authSource=admin
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-engine:8000
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
      - ai-engine
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honey_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
